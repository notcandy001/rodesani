[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/storybloom-core",
    "crates/storybloom-config",
    "crates/storybloom-db",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["StoryBloom Studio Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/notcandy001/storybloom-studio"
rust-version = "1.78"

# ---------------------------------------------------------------------------
# Shared dependency versions. Every workspace member pulls these via
# `<crate>.workspace = true` so version bumps happen in exactly one place.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# --- internal crates ---
storybloom-core   = { path = "crates/storybloom-core" }
storybloom-config = { path = "crates/storybloom-config" }
storybloom-db     = { path = "crates/storybloom-db" }

# --- async runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "signal"] }

# --- error handling ---
anyhow    = "1"
thiserror = "1"

# --- logging / tracing ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender   = "0.2"

# --- serialization / config ---
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
config     = { version = "0.14", default-features = false, features = ["toml"] }

# --- persistence ---
sqlx = { version = "0.7", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# --- HTTP client (OpenAI, and any future external API) ---
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# --- misc domain ---
chrono = { version = "0.4", features = ["serde"] }
uuid   = { version = "1", features = ["v4", "serde"] }
directories = "5"

# --- Subtitle Engine (local, offline speech-to-text) ---
whisper-rs = "0.13"
symphonia  = { version = "0.5", features = ["mp3"] }

# ---------------------------------------------------------------------------
# Release profile tuned for a shippable desktop binary.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
